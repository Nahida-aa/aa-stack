[package]
name = "aa_http_client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# 接口层：自有 `HttpClient` / `AsyncBody` / `FakeHttpClient`。不依赖 reqwest，
# 也不默认依赖 zed 的 `http_client`（后者只用于可选桥接 / patch gpui）。
[dependencies]
anyhow.workspace = true
bytes.workspace = true
futures.workspace = true
http.workspace = true
http_client = { path = "../http_client", optional = true }
url.workspace = true

[features]
# 离线测试用的 `FakeHttpClient`。
test-support = []
# 把 zed `http_client::HttpClient` 适配成本 crate 的 trait。
http-client-bridge = ["dep:http_client"]

[dev-dependencies]
# 单元测试固定打开假客户端与桥接，避免 `cargo test` 默认跳过相关用例。
http_client = { path = "../http_client", features = ["test-support"] }

[lints]
workspace = true
