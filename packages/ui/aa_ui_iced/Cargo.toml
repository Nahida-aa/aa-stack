[package]
name = "aa_ui_iced"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 版本必须与使用方（aa_term）一致：iced 的 `Element` / `Message` 类型要能互通，
# 两份不同版本的 iced 拼不到一起。features 是并集，aa_term 那边额外开 canvas/tokio；
# `svg` 是窗口按钮的图标渲染要用的（resvg，引入后二进制略涨）。
iced = { workspace = true, features = ["svg"] }
# 窗口按钮的图标（`Generic*` SVG，与 aa-zed 侧 `WindowControlType::icon` 同款）。
aa_icons.workspace = true
# 取色走 zed 的语义令牌（`ghost_element_hover`、`text_muted`…），不再用 iced 内置
# `extended_palette`。与本仓其它 theme crate 同一份色值。
aa_theme_iced.workspace = true

[dev-dependencies]
iced_test.workspace = true

[lints]
workspace = true
