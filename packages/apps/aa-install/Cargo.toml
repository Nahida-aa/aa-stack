[package]
name = "aa-install"
description = "按操作系统安装软件：先查仓库/AUR，没有现成的就用 aa-bundle 打包后装（v1 仅 Arch 原生包）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 打包能力复用 aa-bundle 的库（source 解析 / tarball 角色识别 / PKGBUILD -bin 生成）。
# 两者都不在 [workspace.dependencies]（本 workspace 里只有本仓库内部 crate 才收），
# 故走直依赖 path——与 gpui_learn 里 aa-gpui-cli 依赖 aa-bundle 的同款写法。
aa-bundle = { path = "../aa-bundle" }
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
which.workspace = true
# 只为 geteuid()（判断是否在 root 下跑，makepkg 会拒绝）：比拉 nix 轻得多
libc.workspace = true

[lints]
workspace = true
