[package]
name = "aa-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "aa-bundle —— 打包工具（库 + 二进制）：身份解析 / 各平台安装包生成"

# 库侧放**可复用**的打包基础设施（身份解析、文件写入等）；二进制只做 CLI 壳。
# aa-gpui-cli 等工具依赖库侧，不重复实现。
# 包名 kebab → 库名自动规范化为 `aa_bundle`。
[lib]
path = "src/lib.rs"

[[bin]]
name = "aa-bundle"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
# aa-stack 的 serde 条目只带 rc；本包的 BundleMeta 等结构体要 derive，
# 用叠加模式补上（edition 2024 下 features 可叠加、default-features 不可覆盖）。
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
# --source：URL 下载（ureq，同步）、下载/解包暂存（tempfile）、
# tarball 校验和（sha2，手写 hex 格式化不引 hex crate）。
ureq.workspace = true
tempfile.workspace = true
sha2.workspace = true
# 解包后的目录遍历（分类 .desktop / 图标 / ELF）
walkdir.workspace = true

[lints]
workspace = true
